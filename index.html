<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="RUBICON project page. More details and resources are coming soon.">
  <title>RUBICON</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 24px; background: #f7f6f2; color: #202923; font-family: system-ui, sans-serif; }
    main { width: min(100%, 680px); padding: clamp(28px, 7vw, 64px); background: white; border: 1px solid #dce2da; border-top: 5px solid #36684a; border-radius: 12px; }
    .label { color: #36684a; font-size: 12px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; }
    h1 { margin: 20px 0; font-size: clamp(42px, 10vw, 72px); letter-spacing: -.05em; line-height: 1; }
    p { color: #566159; font-size: 18px; line-height: 1.7; }
    a { display: inline-block; margin-top: 16px; padding: 12px 20px; color: white; background: #36684a; border-radius: 6px; text-decoration: none; font-weight: 600; }
    a:hover { background: #284f38; }
    a:focus-visible { outline: 3px solid #b37c22; outline-offset: 4px; }
    footer { margin-top: 36px; font-size: 14px; color: #68746b; }
  </style>
</head>
<body>
  <main>
    <div class="label">Project page</div>
    <h1>RUBICON</h1>
    <p>Welcome to RUBICON. More details and project resources are coming soon.</p>
    <a href="https://github.com/rubicon-eval">Follow on GitHub</a>
    <footer>Thank you for visiting.</footer>
  </main>
</body>
</html>
